[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jocmp/mariner"
publish = false

[workspace.dependencies]
mercury-parser = { path = "crates/mercury-parser" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
clap = { version = "4.6", features = ["derive"] }
dom_query = "0.28.0"
encoding_rs = "0.8.42"
html5ever = "0.39.0"
htmd = "0.5.5"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "cookies", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
