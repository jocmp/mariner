[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2026.11.1001"
edition = "2024"
license = "MIT"
repository = "https://github.com/jocmp/mariner"
publish = false

[workspace.dependencies]
mercury-parser = { path = "crates/mercury-parser" }

async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8.2"
dom_query = "0.28.0"
futures-channel = "0.3.34"
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
encoding_rs = "0.8.42"
html5ever = "0.39.0"
htmd = "0.5.5"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quick-xml = "0.42.0"
ratatui = "0.30.2"
refinery = { version = "0.10.0", features = ["rusqlite"] }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "cookies", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uniffi = { version = "0.32.2", default-features = false }
unicode-width = "0.2.3"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bundled SQLite optimized for size: about 0.6 MB smaller per platform,
# with little effect on its speed.
[profile.release.package.libsqlite3-sys]
opt-level = "s"
